# Public edge. Only this process is published.
# Svelte owns /, /_app, /health, and /admin.
# The API owns JSON, files, and MCP.
# The web container still calls the API on the Docker network for server renders.
#
# Hostnames are resolved by Docker's DNS (getaddrinfo). A variable in proxy_pass
# makes nginx use its own resolver, which turned "web" into 127.0.53.53.

server {
  listen 80;
  server_name _;

  client_max_body_size 15m;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Bill OCR can sit on the upstream for a while.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  location /mcp {
    proxy_pass http://api:8080;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:8080;
  }

  location /images/ {
    proxy_pass http://api:8080;
  }

  location / {
    proxy_pass http://web:3000;
  }
}
